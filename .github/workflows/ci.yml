name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify manifest versions and changelogs
        run: python3 scripts/check-versions.py

      - name: Validate skill and command metadata
        run: python3 scripts/check-skills.py

      - name: Check documentation languages and links
        run: python3 scripts/check-docs.py

      - name: Test linter, lifecycle and hooks
        run: bash tests/selftest.sh

      - name: Verify mutation coverage
        run: python3 tests/mutate.py

      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json \
                   .agents/plugins/marketplace.json .codex-plugin/plugin.json \
                   hooks/hooks.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok  $f"
          done

      - name: Compare marketplace mirrors
        run: |
          diff .claude-plugin/marketplace.json .agents/plugins/marketplace.json \
            && echo "ok  зеркала совпадают"

      - name: Reject tracked working checklists
        run: |
          if git ls-files | grep -qE '(^|/)(_kanon|\.kanon)/'; then
            echo "ОШИБКА: каталог чеклистов под версионным контролем — это рабочие файлы"
            exit 1
          fi
          echo "ok  каталог чеклистов не отслеживается"
